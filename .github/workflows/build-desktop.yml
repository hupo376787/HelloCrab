name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show .NET information
        shell: bash
        run: dotnet --info

      - name: Prepare Unix scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          find one-click-publish -maxdepth 1 \( -name '*.sh' -o -name '*.command' \) -exec chmod +x {} +

      - name: Publish on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish-desktop.ps1 -Runtime '${{ matrix.rid }}' -Configuration Release

      - name: Publish on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/publish-desktop.sh '${{ matrix.rid }}' Release

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish/desktop/${{ matrix.rid }}/*" -DestinationPath "HelloCrab-${{ matrix.rid }}.zip" -Force

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "HelloCrab-${{ matrix.rid }}.tar.gz" -C "publish/desktop/${{ matrix.rid }}" .

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-${{ matrix.rid }}
          path: HelloCrab-${{ matrix.rid }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload Unix package
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-${{ matrix.rid }}
          path: HelloCrab-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          compression-level: 0
