name: Build all platform packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: hellocrab-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  desktop:
    name: Desktop ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Show .NET information
        shell: bash
        run: dotnet --info

      - name: Prepare Unix scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          find one-click-publish -maxdepth 1 \( -name '*.sh' -o -name '*.command' \) -exec chmod +x {} +

      - name: Publish desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/publish-platform.ps1
          -Target '${{ matrix.rid }}'
          -Configuration Release
          -Version '${{ steps.version.outputs.value }}'

      - name: Publish desktop on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash ./scripts/publish-platform.sh
          '${{ matrix.rid }}'
          Release
          '${{ steps.version.outputs.value }}'

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-Desktop-${{ matrix.rid }}
          path: artifacts/HelloCrab-Desktop-${{ matrix.rid }}-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  browser:
    name: Browser WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh

      - name: Publish Browser WebAssembly
        shell: bash
        run: >-
          bash ./scripts/publish-platform.sh
          browser
          Release
          '${{ steps.version.outputs.value }}'

      - name: Upload Browser package
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-Browser
          path: artifacts/HelloCrab-Browser-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Show Android environment
        shell: bash
        run: |
          dotnet --info
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh

      - name: Publish Android APK and AAB
        shell: bash
        run: >-
          bash ./scripts/publish-platform.sh
          android
          Release
          '${{ steps.version.outputs.value }}'

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-Android
          path: artifacts/HelloCrab-Android-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [desktop, browser, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Collect release files and checksums
        shell: bash
        run: |
          mkdir -p release-files

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "release-files/$name" ]]; then
              echo "Duplicate release file name: $name" >&2
              exit 1
            fi
            cp "$file" "release-files/$name"
          done < <(find release-artifacts -type f -print0)

          if ! find release-files -maxdepth 1 -type f | grep -q .; then
            echo "No release files were downloaded." >&2
            exit 1
          fi

          (
            cd release-files
            sha256sum * > SHA256SUMS.txt
          )

          echo "Release files:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"

          echo "Repository: $GH_REPO"
          echo "Release tag: $TAG"

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing files with the same names."
            gh release upload "$TAG" release-files/* \
              --clobber \
              --repo "$GH_REPO"
          else
            gh release create "$TAG" release-files/* \
              --repo "$GH_REPO" \
              --verify-tag \
              --generate-notes \
              --title "HelloCrab $TAG"
          fi
