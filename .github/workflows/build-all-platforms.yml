name: Build all platform packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: hellocrab-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  desktop:
    name: Desktop ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Show .NET information
        shell: bash
        run: dotnet --info

      - name: Prepare Unix scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          find one-click-publish -maxdepth 1 \( -name '*.sh' -o -name '*.command' \) -exec chmod +x {} +

      - name: Publish desktop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/publish-platform.ps1
          -Target '${{ matrix.rid }}'
          -Configuration Release
          -Version '${{ steps.version.outputs.value }}'

      - name: Publish desktop on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash ./scripts/publish-platform.sh
          '${{ matrix.rid }}'
          Release
          '${{ steps.version.outputs.value }}'

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-Desktop-${{ matrix.rid }}
          path: artifacts/HelloCrab-Desktop-${{ matrix.rid }}-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  browser:
    name: Browser WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh

      - name: Publish Browser WebAssembly
        shell: bash
        run: >-
          bash ./scripts/publish-platform.sh
          browser
          Release
          '${{ steps.version.outputs.value }}'

      - name: Upload Browser package
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-Browser
          path: artifacts/HelloCrab-Browser-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Show Android environment
        shell: bash
        run: |
          dotnet --info
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh

      - name: Publish Android APK and AAB
        shell: bash
        run: >-
          bash ./scripts/publish-platform.sh
          android
          Release
          '${{ steps.version.outputs.value }}'

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-Android
          path: artifacts/HelloCrab-Android-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 10.0.203 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.203

      - name: Pin iOS workload set
        shell: bash
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "10.0.203",
              "rollForward": "latestPatch",
              "workloadVersion": "10.0.203.1"
            }
          }
          JSON
          cat global.json

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Select Xcode 26.4 and verify Simulator runtime
        shell: bash
        run: |
          XCODE_APP=""
          for candidate in \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.4*.app; do
            if [[ -d "$candidate/Contents/Developer" ]]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [[ -z "$XCODE_APP" ]]; then
            echo "Xcode 26.4 was not found on this runner." >&2
            echo "Installed Xcode applications:" >&2
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort >&2
            exit 1
          fi

          echo "HELLOCRAB_XCODE_PATH=$XCODE_APP" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"

          echo "Selected Xcode: $XCODE_APP"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

          echo "Installed iOS Simulator runtimes:"
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -Eq 'iOS 26\.4(\.| |$)'; then
            echo "The macOS runner does not contain an iOS 26.4 Simulator runtime." >&2
            exit 1
          fi

      - name: Show iOS build environment
        shell: bash
        run: |
          dotnet --info
          dotnet workload --version
          dotnet workload --info
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --find actool
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

      - name: Prepare scripts
        shell: bash
        run: chmod +x scripts/*.sh

      - name: Build unsigned iOS Simulator package
        shell: bash
        run: >-
          bash ./scripts/publish-platform.sh
          ios-simulator
          Release
          '${{ steps.version.outputs.value }}'

      - name: Detect iOS signing secrets
        id: signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          IOS_CODESIGN_PROVISION: ${{ secrets.IOS_CODESIGN_PROVISION }}
        run: |
          if [[ -n "$IOS_CERTIFICATE_BASE64" \
             && -n "$IOS_CERTIFICATE_PASSWORD" \
             && -n "$IOS_PROVISION_PROFILE_BASE64" \
             && -n "$IOS_CODESIGN_KEY" \
             && -n "$IOS_CODESIGN_PROVISION" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are configured; a signed IPA will also be built."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are incomplete; only the iOS Simulator package will be built."
          fi

      - name: Install Apple certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/hellocrab-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/hellocrab.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/hellocrab-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/hellocrab-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          IOS_CERTIFICATE_BASE64="$IOS_CERTIFICATE_BASE64" \
          IOS_PROVISION_PROFILE_BASE64="$IOS_PROVISION_PROFILE_BASE64" \
          CERTIFICATE_PATH="$CERTIFICATE_PATH" \
          PROFILE_PATH="$PROFILE_PATH" \
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['CERTIFICATE_PATH']).write_bytes(
              base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64']))
          Path(os.environ['PROFILE_PATH']).write_bytes(
              base64.b64decode(os.environ['IOS_PROVISION_PROFILE_BASE64']))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Installed provisioning profile: $PROFILE_UUID"

      - name: Build signed iOS IPA
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          HELLOCRAB_IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          HELLOCRAB_IOS_PROVISION: ${{ secrets.IOS_CODESIGN_PROVISION }}
        run: >-
          bash ./scripts/publish-platform.sh
          ios
          Release
          '${{ steps.version.outputs.value }}'

      - name: Upload iOS packages
        uses: actions/upload-artifact@v7
        with:
          name: HelloCrab-iOS
          path: |
            artifacts/HelloCrab-iOS-Simulator-arm64-${{ steps.version.outputs.value }}.zip
            artifacts/HelloCrab-iOS-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [desktop, browser, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Collect release files and checksums
        shell: bash
        run: |
          mkdir -p release-files

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -e "release-files/$name" ]]; then
              echo "Duplicate release file name: $name" >&2
              exit 1
            fi
            cp "$file" "release-files/$name"
          done < <(find release-artifacts -type f -print0)

          if ! find release-files -maxdepth 1 -type f | grep -q .; then
            echo "No release files were downloaded." >&2
            exit 1
          fi

          (
            cd release-files
            sha256sum * > SHA256SUMS.txt
          )

          echo "Release files:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing files with the same names."
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* \
              --verify-tag \
              --generate-notes \
              --title "HelloCrab $TAG"
          fi
