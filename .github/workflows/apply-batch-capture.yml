name: Apply batch capture import

on:
  push:
    branches:
      - agent/batch-capture-import

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch-capture-import
          fetch-depth: 0

      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Target not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Stop button and task-state integration.
          replace_once(
              'src/HelloCrab.Core/ViewModels/MainWindowViewModel.cs',
              'StopCaptureCommand = new RelayCommand(StopCapture, () => IsCapturing || IsScheduledBatchRunning);',
              'StopCaptureCommand = new RelayCommand(StopCapture, () => IsCapturing || IsScheduledBatchRunning || IsManualBatchRunning);')

          replace_once(
              'src/HelloCrab.Core/ViewModels/MainWindowViewModel.cs',
              '''                OnPropertyChanged(nameof(CanChangeBrowserMode));
                RefreshCommands();''',
              '''                OnPropertyChanged(nameof(CanChangeBrowserMode));
                OnPropertyChanged(nameof(CanStartManualBatchCapture));
                RefreshCommands();''')

          replace_once(
              'src/HelloCrab.Core/ViewModels/MainWindowViewModel.cs',
              '''                OnPropertyChanged(nameof(CanStopCurrentTask));
                RefreshCommands();''',
              '''                OnPropertyChanged(nameof(CanStopCurrentTask));
                OnPropertyChanged(nameof(CanStartManualBatchCapture));
                RefreshCommands();''')

          replace_once(
              'src/HelloCrab.Core/ViewModels/MainWindowViewModel.cs',
              '''        if (IsScheduledBatchRunning)
        {
            _scheduledBatchCts?.Cancel();
            AddLog(_localization.Get(
                "Schedule.Log.CancelRequested",
                "已请求停止定时自动下载任务；当前作者停止后不会继续处理后续历史任务。"));
        }
        _coordinator.Stop();''',
              '''        if (IsScheduledBatchRunning)
        {
            _scheduledBatchCts?.Cancel();
            AddLog(_localization.Get(
                "Schedule.Log.CancelRequested",
                "已请求停止定时自动下载任务；当前作者停止后不会继续处理后续历史任务。"));
        }
        StopManualBatchCapture();
        _coordinator.Stop();''')

          replace_once(
              'src/HelloCrab.Core/ViewModels/MainWindowViewModel.Scheduling.cs',
              'public bool CanStopCurrentTask => IsCapturing || IsScheduledBatchRunning;',
              'public bool CanStopCurrentTask => IsCapturing || IsScheduledBatchRunning || IsManualBatchRunning;')

          replace_once(
              'src/HelloCrab.Core/ViewModels/MainWindowViewModel.Scheduling.cs',
              '''                OnPropertyChanged(nameof(CanStopCurrentTask));
                RefreshCommands();''',
              '''                OnPropertyChanged(nameof(CanStopCurrentTask));
                OnPropertyChanged(nameof(CanStartManualBatchCapture));
                RefreshCommands();''')

          # Add the batch button to Capture Strategy.
          replace_once(
              'src/HelloCrab.Core/Views/MainWindow.axaml',
              '''                <Grid ColumnDefinitions="*,*" ColumnSpacing="10">
                  <Button Content="{DynamicResource Lang.Capture.Start}"
                          Classes="coral sectionAction"
                          Command="{Binding StartCaptureCommand}" />
                  <Button Grid.Column="1"
                          Classes="sectionAction"
                          Content="{DynamicResource Lang.Capture.Stop}"
                          IsEnabled="{Binding CanStopCurrentTask}"
                          Click="StopCaptureButton_Click" />
                </Grid>''',
              '''                <Grid ColumnDefinitions="*,*" ColumnSpacing="10">
                  <Button Content="{DynamicResource Lang.Capture.Start}"
                          Classes="coral sectionAction"
                          Command="{Binding StartCaptureCommand}" />
                  <Button Grid.Column="1"
                          Classes="sectionAction"
                          Content="{DynamicResource Lang.Capture.Stop}"
                          IsEnabled="{Binding CanStopCurrentTask}"
                          Click="StopCaptureButton_Click" />
                </Grid>
                <Button Classes="primary sectionAction"
                        Content="{DynamicResource Lang.Batch.Button}"
                        IsEnabled="{Binding CanStartManualBatchCapture}"
                        Click="BatchCaptureButton_Click" />
                <TextBlock Classes="caption"
                           Text="{DynamicResource Lang.Batch.Description}"
                           TextWrapping="Wrap" />''')

          # Add file picker handler.
          replace_once(
              'src/HelloCrab.Core/Views/MainWindow.axaml.cs',
              '''    private void TitleBar_PointerPressed(object? sender, PointerPressedEventArgs e)
    {''',
              '''    private async void BatchCaptureButton_Click(object? sender, RoutedEventArgs e)
    {
        if (DataContext is not MainWindowViewModel viewModel
            || !viewModel.CanStartManualBatchCapture)
        {
            return;
        }

        var files = await StorageProvider.OpenFilePickerAsync(new FilePickerOpenOptions
        {
            Title = LocalizationService.Current?.Get(
                "Batch.SelectFileDialog",
                "选择批量采集地址文本文件") ?? "选择批量采集地址文本文件",
            AllowMultiple = false,
            FileTypeFilter =
            [
                new FilePickerFileType("Text files")
                {
                    Patterns = ["*.txt"],
                    MimeTypes = ["text/plain"]
                }
            ]
        });

        if (files.Count == 0)
            return;

        try
        {
            await using var stream = await files[0].OpenReadAsync();
            using var reader = new StreamReader(stream, detectEncodingFromByteOrderMarks: true);
            var content = await reader.ReadToEndAsync();
            await viewModel.StartManualBatchCaptureAsync(content);
        }
        catch (Exception ex)
        {
            var template = LocalizationService.Current?.Get(
                "Batch.FileReadFailed",
                "读取批量地址文件失败：{0}") ?? "读取批量地址文件失败：{0}";
            viewModel.AddRemoteLog(string.Format(template, ex.Message));
        }
    }

    private void TitleBar_PointerPressed(object? sender, PointerPressedEventArgs e)
    {''')

          translations = {
              'zh-CN.json': {
                  'Batch.Button': '批量采集并自动下载',
                  'Batch.Description': '导入 TXT 文本文件，每行一个作者地址；允许空行。程序会按文件顺序逐个采集并自动下载。',
                  'Batch.SelectFileDialog': '选择批量采集地址文本文件',
                  'Batch.FileReadFailed': '读取批量地址文件失败：{0}',
                  'Batch.Log.Busy': '当前已有任务运行，无法开始批量采集。',
                  'Batch.Log.Empty': '导入的文本文件没有有效地址；空行会被自动忽略。',
                  'Batch.Log.Started': '批量采集开始，共读取到 {0} 个非空地址。',
                  'Batch.Log.InvalidUrl': '批量第 {0} 行没有可用地址，已跳过：{1}',
                  'Batch.Log.UnsupportedUrl': '批量第 {0} 项无法识别所属平台，已跳过：{1}',
                  'Batch.Log.ItemStarted': '批量任务 {0}/{1}：正在处理 {2}，地址：{3}',
                  'Batch.Log.LoginRequired': '批量第 {0} 项（{1}）需要重新登录，已暂停后续任务。',
                  'Batch.Log.ItemFailed': '批量第 {0} 项处理失败，继续下一项：{1}',
                  'Batch.Log.Completed': '批量采集完成：成功处理 {0} 项，失败或跳过 {1} 项，共 {2} 项。',
                  'Batch.Log.Canceled': '批量采集已停止：已处理 {0}/{1} 项。',
                  'Batch.Log.CancelRequested': '已请求停止批量采集；当前作者停止后不会继续处理后续地址。'
              },
              'en-US.json': {
                  'Batch.Button': 'Batch capture and download',
                  'Batch.Description': 'Import a TXT file with one author URL per line. Blank lines are allowed. URLs are captured and downloaded sequentially.',
                  'Batch.SelectFileDialog': 'Select batch capture URL text file',
                  'Batch.FileReadFailed': 'Failed to read the batch URL file: {0}',
                  'Batch.Log.Busy': 'Another task is already running. Batch capture cannot start.',
                  'Batch.Log.Empty': 'The imported text file contains no valid addresses. Blank lines are ignored.',
                  'Batch.Log.Started': 'Batch capture started with {0} non-empty addresses.',
                  'Batch.Log.InvalidUrl': 'Batch line {0} has no usable URL and was skipped: {1}',
                  'Batch.Log.UnsupportedUrl': 'Batch item {0} belongs to no supported platform and was skipped: {1}',
                  'Batch.Log.ItemStarted': 'Batch item {0}/{1}: processing {2}, URL: {3}',
                  'Batch.Log.LoginRequired': 'Batch item {0} ({1}) requires login. Remaining items are paused.',
                  'Batch.Log.ItemFailed': 'Batch item {0} failed; continuing with the next item: {1}',
                  'Batch.Log.Completed': 'Batch capture completed: {0} processed, {1} failed or skipped, {2} total.',
                  'Batch.Log.Canceled': 'Batch capture stopped after processing {0}/{1} items.',
                  'Batch.Log.CancelRequested': 'Batch capture stop requested. No later URL will run after the current author stops.'
              },
              'ja-JP.json': {
                  'Batch.Button': '一括収集して自動ダウンロード',
                  'Batch.Description': '作者 URL を1行に1件記載した TXT ファイルを読み込みます。空行を許可し、上から順に収集して自動ダウンロードします。',
                  'Batch.SelectFileDialog': '一括収集 URL のテキストファイルを選択',
                  'Batch.FileReadFailed': '一括 URL ファイルを読み込めませんでした：{0}',
                  'Batch.Log.Busy': '別のタスクが実行中のため、一括収集を開始できません。',
                  'Batch.Log.Empty': '読み込んだテキストファイルに有効な URL がありません。空行は無視されます。',
                  'Batch.Log.Started': '一括収集を開始しました。空行を除く URL は {0} 件です。',
                  'Batch.Log.InvalidUrl': '{0} 行目に使用可能な URL がないためスキップしました：{1}',
                  'Batch.Log.UnsupportedUrl': '{0} 件目のプラットフォームを判定できないためスキップしました：{1}',
                  'Batch.Log.ItemStarted': '一括タスク {0}/{1}：{2} を処理中、URL：{3}',
                  'Batch.Log.LoginRequired': '{0} 件目（{1}）は再ログインが必要です。後続タスクを一時停止しました。',
                  'Batch.Log.ItemFailed': '{0} 件目の処理に失敗しました。次へ続行します：{1}',
                  'Batch.Log.Completed': '一括収集完了：処理成功 {0} 件、失敗またはスキップ {1} 件、合計 {2} 件。',
                  'Batch.Log.Canceled': '一括収集を停止しました：{0}/{1} 件を処理済みです。',
                  'Batch.Log.CancelRequested': '一括収集の停止を要求しました。現在の作者停止後、後続 URL は処理しません。'
              }
          }

          for filename, additions in translations.items():
              path = Path('src/HelloCrab.Core/Languages') / filename
              data = json.loads(path.read_text(encoding='utf-8-sig'))
              strings = data['strings']
              # Insert order is preserved at the end; resource lookup is key-based.
              strings.update(additions)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Land the previously reported X scope fix in source and remove its temporary workflow.
          x_path = Path('src/HelloCrab.Core/Sites/X/XSiteAdapter.cs')
          x_text = x_path.read_text(encoding='utf-8-sig')
          x_text = x_text.replace(
              'if (TryObject(instruction, "entry", out var entry))\n                        ProcessEntry(entry, tweets, ref bottomCursor);',
              'if (TryObject(instruction, "entry", out var singleEntry))\n                        ProcessEntry(singleEntry, tweets, ref bottomCursor);',
              1)
          x_path.write_text(x_text, encoding='utf-8')

          old_workflow = Path('.github/workflows/fix-x-entry-main.yml')
          if old_workflow.exists():
              old_workflow.unlink()

          # Validate language files immediately.
          for filename in translations:
              json.loads((Path('src/HelloCrab.Core/Languages') / filename).read_text(encoding='utf-8'))

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build desktop
        run: |
          dotnet restore src/HelloCrab.Desktop/HelloCrab.Desktop.csproj
          dotnet build src/HelloCrab.Desktop/HelloCrab.Desktop.csproj --configuration Release --no-restore

      - name: Commit source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-batch-capture.yml
          git add -A
          git commit -m "Add batch capture import and automatic download"
          git push origin HEAD:agent/batch-capture-import
