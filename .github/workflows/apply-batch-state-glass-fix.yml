name: Apply batch state and glass dialog fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          main_vm = 'src/HelloCrab.Core/ViewModels/MainWindowViewModel.cs'

          replace_once(
              main_vm,
              '        StopCaptureCommand = new RelayCommand(StopCapture, () => IsCapturing || IsScheduledBatchRunning);',
              '        StopCaptureCommand = new RelayCommand(\n'
              '            StopCapture,\n'
              '            () => IsCapturing || IsScheduledBatchRunning || IsManualBatchRunning);')

          replace_once(
              main_vm,
              '                OnPropertyChanged(nameof(CanChangeBrowserMode));\n                RefreshCommands();',
              '                OnPropertyChanged(nameof(CanChangeBrowserMode));\n'
              '                OnPropertyChanged(nameof(CanStartManualBatchCapture));\n'
              '                RefreshCommands();')

          replace_once(
              main_vm,
              '                OnPropertyChanged(nameof(CanStopCurrentTask));\n                RefreshCommands();',
              '                OnPropertyChanged(nameof(CanStopCurrentTask));\n'
              '                OnPropertyChanged(nameof(CanStartManualBatchCapture));\n'
              '                RefreshCommands();')

          replace_once(
              main_vm,
              '        if (EnablePersonDetection)\n            AddPersonDetectionModelLog(RefreshPersonDetectionModelStatus());\n\n        ClearCurrentCover();',
              '        if (EnablePersonDetection)\n            AddPersonDetectionModelLog(RefreshPersonDetectionModelStatus());\n\n'
              '        ClearCurrentAuthorDisplayForNextCapture();\n'
              '        ClearCurrentCover();')

          replace_once(
              main_vm,
              '            IsCapturing = false;\n            CurrentWork = "-";\n            ClearCurrentAuthorAvatar();\n            ClearCurrentCover();\n            RefreshCommands();',
              '            IsCapturing = false;\n'
              '            CurrentWork = "-";\n'
              '            // 下载完成后保留当前作者头像和作者信息，便于用户确认本次结果。\n'
              '            // 下一次采集开始前再统一清空。\n'
              '            ClearCurrentCover();\n'
              '            RefreshCommands();')

          replace_once(
              main_vm,
              '        if (IsScheduledBatchRunning)\n        {\n            _scheduledBatchCts?.Cancel();\n            AddLog(_localization.Get(\n                "Schedule.Log.CancelRequested",\n                "已请求停止定时自动下载任务；当前作者停止后不会继续处理后续历史任务。"));\n        }\n        _coordinator.Stop();',
              '        if (IsScheduledBatchRunning)\n'
              '        {\n'
              '            _scheduledBatchCts?.Cancel();\n'
              '            AddLog(_localization.Get(\n'
              '                "Schedule.Log.CancelRequested",\n'
              '                "已请求停止定时自动下载任务；当前作者停止后不会继续处理后续历史任务。"));\n'
              '        }\n'
              '        if (IsManualBatchRunning)\n'
              '            CancelManualBatchCapture();\n\n'
              '        _coordinator.Stop();')

          batch_vm = 'src/HelloCrab.Core/ViewModels/MainWindowViewModel.BatchCapture.cs'
          text = read(batch_vm)
          if not text.startswith('using Avalonia.Threading;'):
              text = 'using Avalonia.Threading;\n' + text

          old = '''        finally
        {
            _manualBatchCts = null;
            IsManualBatchRunning = false;
            IsBusy = false;
            RefreshCommands();
        }'''
          new = '''        finally
        {
            _manualBatchCts = null;

            // 先释放通用忙碌状态，再结束批量状态。这样最后一次
            // CanStartManualBatchCapture 属性通知读取到的就是最终可用状态。
            IsBusy = false;
            IsManualBatchRunning = false;
            OnPropertyChanged(nameof(CanStartManualBatchCapture));
            RefreshCommands();

            // AsyncRelayCommand 和按钮绑定可能在当前调用栈结束后才更新，
            // 再在 UI 队列尾部刷新一次，确保“开始采集”和“批量采集”立即恢复。
            Dispatcher.UIThread.Post(() =>
            {
                OnPropertyChanged(nameof(CanStartManualBatchCapture));
                RefreshCommands();
            }, DispatcherPriority.Background);
        }'''
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError('batch finally block not found exactly once')
              text = text.replace(old, new, 1)

          old = '''    public void CancelManualBatchCapture()
    {
        if (!IsManualBatchRunning)
            return;

        _manualBatchCts?.Cancel();
        AddLog(BatchText(
            "Batch.Log.CancelRequested",
            "已请求停止批量采集；当前作者停止后不会继续处理后续地址。"));
    }

    private string BatchText'''
          new = '''    public void CancelManualBatchCapture()
    {
        if (!IsManualBatchRunning
            || _manualBatchCts is not { } cts
            || cts.IsCancellationRequested)
        {
            return;
        }

        cts.Cancel();
        AddLog(BatchText(
            "Batch.Log.CancelRequested",
            "已请求停止批量采集；当前作者停止后不会继续处理后续地址。"));
    }

    private void ClearCurrentAuthorDisplayForNextCapture()
    {
        ClearCurrentAuthorAvatar();
        CurrentAuthorName = null;
        CurrentAuthorId = null;
        CurrentAuthorDirectory = null;
    }

    private string BatchText'''
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError('CancelManualBatchCapture block not found exactly once')
              text = text.replace(old, new, 1)

          write(batch_vm, text)

          scheduling = 'src/HelloCrab.Core/ViewModels/MainWindowViewModel.Scheduling.cs'
          replace_once(
              scheduling,
              '    public bool CanStopCurrentTask => IsCapturing || IsScheduledBatchRunning;',
              '    public bool CanStopCurrentTask\n'
              '        => IsCapturing || IsScheduledBatchRunning || IsManualBatchRunning;')

          dialog_file = 'src/HelloCrab.Core/Views/MainWindow.BatchCapture.cs'
          text = read(dialog_file)
          if 'using Avalonia.Controls.Chrome;' not in text:
              text = text.replace(
                  'using Avalonia.Controls;\n',
                  'using Avalonia.Controls;\nusing Avalonia.Controls.Chrome;\n',
                  1)
          if 'using Avalonia.Input;' not in text:
              text = text.replace(
                  'using Avalonia.Layout;\n',
                  'using Avalonia.Layout;\nusing Avalonia.Input;\n',
                  1)

          start_marker = '    private async Task<string?> ShowBatchCaptureDialogAsync(MainWindowViewModel viewModel)\n'
          start = text.index(start_marker)
          end = text.rfind('\n}')
          if end <= start:
              raise RuntimeError('Could not locate batch dialog method boundary')

          method = r'''    private async Task<string?> ShowBatchCaptureDialogAsync(MainWindowViewModel viewModel)
    {
        var localization = LocalizationService.Current;
        var isDark = viewModel.IsDarkTheme;
        var titleText = localization?.Get("Batch.Dialog.Title", "批量采集") ?? "批量采集";

        var textPrimary = new SolidColorBrush(Color.Parse(isDark ? "#F7F7FB" : "#202231"));
        var textSecondary = new SolidColorBrush(Color.Parse(isDark ? "#C3C7D4" : "#62687A"));
        var frameBackground = new SolidColorBrush(Color.Parse(isDark ? "#D21A1825" : "#E8FFFFFF"));
        var contentBackground = new SolidColorBrush(Color.Parse(isDark ? "#B8242232" : "#CFF7F7FC"));
        var inputBackground = new SolidColorBrush(Color.Parse(isDark ? "#A92E2B3C" : "#CFFFFFFF"));
        var borderBrush = new SolidColorBrush(Color.Parse(isDark ? "#55FFFFFF" : "#331B1D2A"));

        var editor = new TextBox
        {
            AcceptsReturn = true,
            TextWrapping = TextWrapping.Wrap,
            PlaceholderText = localization?.Get(
                "Batch.Dialog.Placeholder",
                "在这里粘贴或编辑作者地址，每行一条。允许包含分享文案，程序会自动提取每行中的第一个网址。")
                ?? "在这里粘贴或编辑作者地址，每行一条。允许包含分享文案，程序会自动提取每行中的第一个网址。",
            MinHeight = 300,
            Padding = new Thickness(14),
            Background = inputBackground,
            Foreground = textPrimary,
            BorderBrush = borderBrush,
            BorderThickness = new Thickness(1),
            CornerRadius = new CornerRadius(10)
        };
        ScrollViewer.SetHorizontalScrollBarVisibility(editor, ScrollBarVisibility.Disabled);
        ScrollViewer.SetVerticalScrollBarVisibility(editor, ScrollBarVisibility.Auto);

        var title = new TextBlock
        {
            Text = titleText,
            FontSize = 19,
            FontWeight = FontWeight.SemiBold,
            Foreground = Brushes.White,
            VerticalAlignment = VerticalAlignment.Center
        };
        var titleHint = new TextBlock
        {
            Text = "HelloCrab · Batch Capture",
            FontSize = 11,
            Foreground = new SolidColorBrush(Color.Parse("#D9FFFFFF")),
            Margin = new Thickness(0, 2, 0, 0)
        };
        var titlePanel = new StackPanel
        {
            Margin = new Thickness(18, 0, 0, 0),
            Spacing = 0,
            VerticalAlignment = VerticalAlignment.Center,
            Children =
            {
                title,
                titleHint
            }
        };

        var closeButton = new Button
        {
            Content = "×",
            Width = 44,
            Height = 40,
            Margin = new Thickness(0, 0, 8, 0),
            Padding = new Thickness(0),
            FontSize = 22,
            Background = Brushes.Transparent,
            Foreground = Brushes.White,
            BorderThickness = new Thickness(0),
            HorizontalContentAlignment = HorizontalAlignment.Center,
            VerticalContentAlignment = VerticalAlignment.Center
        };

        var titleBarGrid = new Grid();
        titleBarGrid.ColumnDefinitions.Add(new ColumnDefinition(new GridLength(1, GridUnitType.Star)));
        titleBarGrid.ColumnDefinitions.Add(new ColumnDefinition(GridLength.Auto));
        titleBarGrid.Children.Add(titlePanel);
        Grid.SetColumn(closeButton, 1);
        titleBarGrid.Children.Add(closeButton);

        var titleBar = new Border
        {
            Height = 64,
            Background = new SolidColorBrush(Color.Parse("#C9672FD4")),
            Child = titleBarGrid
        };
        WindowDecorationProperties.SetElementRole(
            titleBar,
            WindowDecorationsElementRole.TitleBar);
        WindowDecorationProperties.SetElementRole(
            closeButton,
            WindowDecorationsElementRole.User);

        var description = new TextBlock
        {
            Text = localization?.Get(
                "Batch.Dialog.Description",
                "请检查并编辑待采集文本。点击“确定”解析当前文本，或点击“导入外部txt”读取文件并立即开始解析。")
                ?? "请检查并编辑待采集文本。点击“确定”解析当前文本，或点击“导入外部txt”读取文件并立即开始解析。",
            TextWrapping = TextWrapping.Wrap,
            Foreground = textSecondary
        };

        var importButton = new Button
        {
            Content = localization?.Get("Batch.Dialog.Import", "导入外部txt") ?? "导入外部txt",
            MinWidth = 132,
            Height = 40,
            HorizontalContentAlignment = HorizontalAlignment.Center,
            Background = new SolidColorBrush(Color.Parse(isDark ? "#554A465D" : "#55FFFFFF")),
            Foreground = textPrimary,
            BorderBrush = borderBrush,
            BorderThickness = new Thickness(1),
            CornerRadius = new CornerRadius(8)
        };
        var confirmButton = new Button
        {
            Content = localization?.Get("Batch.Dialog.Confirm", "确定") ?? "确定",
            MinWidth = 100,
            Height = 40,
            HorizontalContentAlignment = HorizontalAlignment.Center,
            Background = new SolidColorBrush(Color.Parse("#7C3AED")),
            Foreground = Brushes.White,
            BorderThickness = new Thickness(0),
            CornerRadius = new CornerRadius(8),
            FontWeight = FontWeight.SemiBold
        };
        var buttons = new StackPanel
        {
            Orientation = Orientation.Horizontal,
            HorizontalAlignment = HorizontalAlignment.Right,
            Spacing = 12,
            Children =
            {
                importButton,
                confirmButton
            }
        };

        var contentGrid = new Grid
        {
            RowSpacing = 16
        };
        contentGrid.RowDefinitions.Add(new RowDefinition(GridLength.Auto));
        contentGrid.RowDefinitions.Add(new RowDefinition(new GridLength(1, GridUnitType.Star)));
        contentGrid.RowDefinitions.Add(new RowDefinition(GridLength.Auto));
        contentGrid.Children.Add(description);
        Grid.SetRow(editor, 1);
        contentGrid.Children.Add(editor);
        Grid.SetRow(buttons, 2);
        contentGrid.Children.Add(buttons);

        var contentBorder = new Border
        {
            Padding = new Thickness(24),
            Background = contentBackground,
            Child = contentGrid
        };

        var rootGrid = new Grid();
        rootGrid.RowDefinitions.Add(new RowDefinition(GridLength.Auto));
        rootGrid.RowDefinitions.Add(new RowDefinition(new GridLength(1, GridUnitType.Star)));
        rootGrid.Children.Add(titleBar);
        Grid.SetRow(contentBorder, 1);
        rootGrid.Children.Add(contentBorder);

        var frame = new Border
        {
            Margin = new Thickness(1),
            CornerRadius = new CornerRadius(14),
            ClipToBounds = true,
            Background = frameBackground,
            BorderBrush = borderBrush,
            BorderThickness = new Thickness(1),
            Child = rootGrid
        };

        var dialog = new Window
        {
            Title = titleText,
            Width = 760,
            Height = 560,
            MinWidth = 560,
            MinHeight = 420,
            WindowStartupLocation = WindowStartupLocation.CenterOwner,
            CanResize = true,
            ShowInTaskbar = false,
            WindowDecorations = WindowDecorations.None,
            ExtendClientAreaToDecorationsHint = true,
            Background = Brushes.Transparent,
            TransparencyLevelHint = new[]
            {
                WindowTransparencyLevel.AcrylicBlur,
                WindowTransparencyLevel.Blur,
                WindowTransparencyLevel.Transparent
            },
            Content = frame
        };

        dialog.Opened += (_, _) => editor.Focus();
        closeButton.Click += (_, _) => dialog.Close((string?)null);
        confirmButton.Click += (_, _) => dialog.Close(editor.Text ?? string.Empty);
        importButton.Click += async (_, _) =>
        {
            var files = await StorageProvider.OpenFilePickerAsync(new FilePickerOpenOptions
            {
                Title = localization?.Get(
                    "Batch.SelectFileDialog",
                    "选择批量采集地址文本文件") ?? "选择批量采集地址文本文件",
                AllowMultiple = false,
                FileTypeFilter = new[]
                {
                    new FilePickerFileType("Text files")
                    {
                        Patterns = new[] { "*.txt" },
                        MimeTypes = new[] { "text/plain" }
                    }
                }
            });

            if (files.Count == 0)
                return;

            importButton.IsEnabled = false;
            confirmButton.IsEnabled = false;
            try
            {
                await using var stream = await files[0].OpenReadAsync();
                using var reader = new StreamReader(stream, detectEncodingFromByteOrderMarks: true);
                var importedContent = await reader.ReadToEndAsync();
                dialog.Close(importedContent);
            }
            catch (Exception ex)
            {
                var template = localization?.Get(
                    "Batch.FileReadFailed",
                    "读取批量地址文件失败：{0}") ?? "读取批量地址文件失败：{0}";
                viewModel.AddRemoteLog(string.Format(template, ex.Message));
                importButton.IsEnabled = true;
                confirmButton.IsEnabled = true;
            }
        };

        return await dialog.ShowDialog<string?>(this);
    }
'''
          text = text[:start] + method + text[end:]
          write(dialog_file, text)
          PY

      - name: Validate source
        shell: bash
        run: |
          dotnet restore src/HelloCrab.Desktop/HelloCrab.Desktop.csproj
          dotnet build src/HelloCrab.Desktop/HelloCrab.Desktop.csproj -c Release -f net10.0 --no-restore

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-batch-state-glass-fix.yml
          git add src/HelloCrab.Core/ViewModels/MainWindowViewModel.cs
          git add src/HelloCrab.Core/ViewModels/MainWindowViewModel.BatchCapture.cs
          git add src/HelloCrab.Core/ViewModels/MainWindowViewModel.Scheduling.cs
          git add src/HelloCrab.Core/Views/MainWindow.BatchCapture.cs
          git commit -m "Fix batch stop state and style batch dialog"
          git push origin HEAD:main
