name: Apply batch state and glass fixes fast

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Reuse patch script from validation workflow
        shell: bash
        run: |
          python3 - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/apply-batch-state-glass-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          output = Path('/tmp/apply-batch-state-glass-fix.py')
          output.write_text(script, encoding='utf-8')
          print(f'Extracted {len(script.splitlines())} Python lines to {output}.')
          EXTRACT
          python3 /tmp/apply-batch-state-glass-fix.py

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-batch-state-glass-fix.yml
          git rm .github/workflows/apply-batch-state-glass-fast.yml
          git add src/HelloCrab.Core/ViewModels/MainWindowViewModel.cs
          git add src/HelloCrab.Core/ViewModels/MainWindowViewModel.BatchCapture.cs
          git add src/HelloCrab.Core/ViewModels/MainWindowViewModel.Scheduling.cs
          git add src/HelloCrab.Core/Views/MainWindow.BatchCapture.cs
          git commit -m "Fix batch stop state and style batch dialog"
          git push origin HEAD:main
