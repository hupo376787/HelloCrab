name: Apply more Live Photo adapters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-more-livephoto-adapters.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply adapter changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def update_file(path, transform):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              updated = transform(text)
              if updated == text:
                  raise SystemExit(f'No change applied to {path}')
              p.write_text(updated, encoding='utf-8')

          def douyin(text):
              old = '''            result.Add(new MediaAsset(
                MediaAssetType.Image,
                index++,
                urls,
                Width: (int)ReadInt64(image, "width"),
                Height: (int)ReadInt64(image, "height")));'''
              new = '''            result.Add(new MediaAsset(
                MediaAssetType.Image,
                index,
                urls,
                Width: (int)ReadInt64(image, "width"),
                Height: (int)ReadInt64(image, "height")));

            var livePhoto = ParseImageLivePhoto(image, index);
            if (livePhoto is not null)
                result.Add(livePhoto);
            index++;'''
              if old not in text:
                  raise SystemExit('Douyin image loop anchor not found')
              text = text.replace(old, new, 1)
              marker = '    private static MediaAsset? ParseBestVideo(JsonElement aweme)\n'
              helper = '''    private static MediaAsset? ParseImageLivePhoto(JsonElement image, int index)
    {
        var urls = new List<string>();
        var width = (int)ReadInt64(image, "width");
        var height = (int)ReadInt64(image, "height");

        if (TryGetObject(image, "video", out var video))
        {
            urls.AddRange(ReadUrlListFromKnownContainers(video,
                "play_addr_265", "play_addr_bytevc1", "play_addr_h264", "play_addr", "download_addr"));
            if (TryGetArray(video, "bit_rate", out var bitRates))
            {
                foreach (var bitrate in bitRates.EnumerateArray().OrderByDescending(item => ReadInt64(item, "bit_rate")))
                {
                    urls.AddRange(ReadUrlListFromKnownContainers(bitrate,
                        "play_addr_265", "play_addr_bytevc1", "play_addr_h264", "play_addr"));
                }
            }
        }

        if (TryGetObject(image, "clip_video", out var clipVideo))
        {
            urls.AddRange(ReadUrlListFromKnownContainers(clipVideo,
                "play_addr_265", "play_addr_bytevc1", "play_addr_h264", "play_addr", "download_addr"));
        }

        AddUrlsFromFlexibleProperty(image, "video_url", urls);
        AddUrlsFromFlexibleProperty(image, "videoUrl", urls);
        AddUrlsFromFlexibleProperty(image, "live_url", urls);
        AddUrlsFromFlexibleProperty(image, "liveUrl", urls);
        AddUrlsFromFlexibleProperty(image, "motion_url", urls);
        AddUrlsFromFlexibleProperty(image, "motionUrl", urls);

        var normalized = NormalizeUrls(urls);
        return normalized.Count == 0
            ? null
            : new MediaAsset(MediaAssetType.LivePhoto, index, normalized, Width: width, Height: height);
    }

'''
              if marker not in text:
                  raise SystemExit('Douyin helper anchor not found')
              return text.replace(marker, helper + marker, 1)

          def xhs(text):
              old = '''            assets.Add(new MediaAsset(
                MediaAssetType.Image,
                index++,
                urls,
                Width: (int)ReadFirstInt64(image, "width", "w"),
                Height: (int)ReadFirstInt64(image, "height", "h")));'''
              new = '''            assets.Add(new MediaAsset(
                MediaAssetType.Image,
                index,
                urls,
                Width: (int)ReadFirstInt64(image, "width", "w"),
                Height: (int)ReadFirstInt64(image, "height", "h")));

            var livePhoto = ParseImageLivePhoto(image, index);
            if (livePhoto is not null)
                assets.Add(livePhoto);
            index++;'''
              if old not in text:
                  raise SystemExit('XHS image loop anchor not found')
              text = text.replace(old, new, 1)
              marker = '    private static MediaAsset? ParseCover(JsonElement note, WorkItem listingWork)\n'
              helper = '''    private static MediaAsset? ParseImageLivePhoto(JsonElement image, int index)
    {
        var candidates = new List<VideoCandidate>();

        if (TryGetObject(image, "livePhoto", out var livePhoto)
            || TryGetObject(image, "live_photo", out livePhoto))
        {
            CollectVideoCandidates(livePhoto, "image.livePhoto", 0, 0, 0, candidates);
        }

        if (image.ValueKind == JsonValueKind.Object && image.TryGetProperty("stream", out var stream))
            CollectVideoCandidates(stream, "image.stream", 0, 0, 0, candidates);

        foreach (var field in new[] { "streamUrl", "stream_url", "livePhotoVideo", "live_photo_video", "liveUrl", "live_url" })
        {
            if (image.ValueKind == JsonValueKind.Object && image.TryGetProperty(field, out var value))
                CollectVideoCandidates(value, $"image.{field}", 0, 0, 0, candidates);
        }

        var ordered = candidates
            .Where(item => !string.IsNullOrWhiteSpace(item.Url))
            .GroupBy(item => item.Url, StringComparer.Ordinal)
            .Select(group => group
                .OrderBy(item => CodecRank(item.Codec))
                .ThenByDescending(item => item.Bitrate)
                .ThenByDescending(item => (long)item.Width * item.Height)
                .First())
            .OrderBy(item => CodecRank(item.Codec))
            .ThenByDescending(item => item.Bitrate)
            .ThenByDescending(item => (long)item.Width * item.Height)
            .ToArray();

        if (ordered.Length == 0)
            return null;

        var first = ordered[0];
        return new MediaAsset(
            MediaAssetType.LivePhoto,
            index,
            ordered.Select(item => item.Url).ToArray(),
            first.Bitrate,
            first.Width,
            first.Height,
            first.Codec);
    }

'''
              if marker not in text:
                  raise SystemExit('XHS helper anchor not found')
              return text.replace(marker, helper + marker, 1)

          update_file('src/HelloCrab.Core/Sites/Douyin/DouyinSiteAdapter.cs', douyin)
          update_file('src/HelloCrab.Core/Sites/Xiaohongshu/XiaohongshuSiteAdapter.cs', xhs)
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-more-livephoto-adapters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support Live Photos on Douyin and Xiaohongshu'
          git push origin HEAD:main
