name: Apply Runtime I18n Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-runtime-i18n.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .i18n-patch/part01.b64
            cat .i18n-patch/part02.b64
            cat .i18n-patch/part03.b64
            cat .i18n-patch/part04.b64
            cat .i18n-patch/part05.b64
            cat .i18n-patch/part06.b64
            cat .i18n-patch/part07.b64
            cat .i18n-patch/part08a.b64
            cat .i18n-patch/part08b.b64
            cat .i18n-patch/part09a.b64
            cat .i18n-patch/part09b.b64
            cat .i18n-patch/part10a.b64
            cat .i18n-patch/part10b.b64
            cat .i18n-patch/part11a.b64
            cat .i18n-patch/part11b.b64
          } | tr -d '\r\n ' > /tmp/hellocrab-i18n.b64

          test "$(wc -c < /tmp/hellocrab-i18n.b64)" -eq 83624
          base64 --decode /tmp/hellocrab-i18n.b64 > /tmp/hellocrab-i18n.patch.gz
          echo 'ee760d5b27b23032c617ba868ba9292358c854813d4a4800e9b6034ef2f29ce3  /tmp/hellocrab-i18n.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/hellocrab-i18n.patch.gz > /tmp/hellocrab-i18n.patch
          echo 'c055189b1f1bd234be4b3da6d5273ca5dad5bf8c09d27676776635211be7117b  /tmp/hellocrab-i18n.patch' | sha256sum --check
          git apply --check -p2 /tmp/hellocrab-i18n.patch
          git apply -p2 /tmp/hellocrab-i18n.patch

      - name: Add latest UI localization keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          additions = {
              'zh-CN': {
                  'Download.LongFileNames': '解除长路径限制',
                  'Download.LongFileNamesDescription': '开启后作品标题文件名最长由 170 提高到 220 个字符；仍受操作系统和文件系统限制。',
              },
              'en-US': {
                  'Download.LongFileNames': 'Allow longer file names',
                  'Download.LongFileNamesDescription': 'When enabled, work title file names can grow from 170 to 220 characters. Operating-system and file-system limits still apply.',
              },
              'ja-JP': {
                  'Download.LongFileNames': '長いファイル名を許可',
                  'Download.LongFileNamesDescription': '有効にすると、作品タイトルのファイル名上限を 170 文字から 220 文字へ拡張します。OS とファイルシステムの制限は引き続き適用されます。',
              },
          }
          root = pathlib.Path('src/HelloCrab.Core/Languages')
          for code, values in additions.items():
              path = root / f'{code}.json'
              data = json.loads(path.read_text(encoding='utf-8-sig'))
              key = 'strings' if 'strings' in data else 'Strings'
              data[key].update(values)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate localization resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('src/HelloCrab.Core')
          packs = {}
          for code in ('zh-CN', 'en-US', 'ja-JP'):
              path = root / 'Languages' / f'{code}.json'
              data = json.loads(path.read_text(encoding='utf-8-sig'))
              strings = data['strings'] if 'strings' in data else data['Strings']
              packs[code] = strings

          key_sets = [set(v) for v in packs.values()]
          if not (key_sets[0] == key_sets[1] == key_sets[2]):
              raise SystemExit('Language key sets are not identical.')
          if len(key_sets[0]) != 565:
              raise SystemExit(f'Unexpected localization key count: {len(key_sets[0])}')

          expected = {
              'zh-CN': '批量采集并自动下载',
              'en-US': 'Batch collect and auto-download',
              'ja-JP': '一括収集して自動ダウンロード',
          }
          for code, value in expected.items():
              if packs[code].get('Batch.Button') != value:
                  raise SystemExit(f'Batch.Button mismatch for {code}')

          refs = set()
          patterns = [
              re.compile(r'RuntimeLocalization\.(?:Get|Format)\(\s*"([^"]+)"'),
              re.compile(r'_localization\.(?:Get|Format)\(\s*"([^"]+)"'),
              re.compile(r'Localize\(\s*"([^"]+)"'),
              re.compile(r'AddLocalizedLog\(\s*"([^"]+)"'),
          ]
          for path in pathlib.Path('src').rglob('*.cs'):
              text = path.read_text(encoding='utf-8-sig', errors='ignore')
              for pattern in patterns:
                  refs.update(pattern.findall(text))
          missing = sorted(refs - key_sets[0])
          if missing:
              raise SystemExit('Missing localization keys: ' + ', '.join(missing))

          print(f'Localization OK: {len(key_sets[0])} keys, {len(refs)} referenced literal keys.')
          PY

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Desktop
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/HelloCrab.Desktop/HelloCrab.Desktop.csproj
          dotnet build src/HelloCrab.Desktop/HelloCrab.Desktop.csproj -c Release --no-restore

      - name: Commit localization changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .i18n-patch
          rm -f .github/workflows/apply-runtime-i18n.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Localize batch UI and runtime logs'
          git push origin HEAD:main
