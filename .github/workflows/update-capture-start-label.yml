name: Update Capture Start Label

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-capture-start-label.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update English label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/HelloCrab.Core/Languages/en-US.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          strings = data['strings'] if 'strings' in data else data['Strings']
          old = strings.get('Capture.Start')
          if old != 'Collect all author works':
              raise SystemExit(f'Unexpected Capture.Start value: {old!r}')
          strings['Capture.Start'] = 'Collect all works'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('src/HelloCrab.Core/Languages/en-US.json').read_text(encoding='utf-8-sig'))
          strings = data['strings'] if 'strings' in data else data['Strings']
          assert strings['Capture.Start'] == 'Collect all works'
          print('Capture.Start =', strings['Capture.Start'])
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-capture-start-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update English capture start label'
          git push origin HEAD:main
